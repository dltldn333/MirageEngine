<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MirageEngine Test</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>

    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: "Arial", sans-serif;
        line-height: 2.2;
        background-color: #f0f0f0;
        color: #333;
        overscroll-behavior: none;
        overflow: hidden;
        height: 100vh;
      }
      
      .showcase {
        height: 100vh;
        overflow-y: auto;
      }

      .showcase-content {
        min-height: 200vh;
      }

      #root {
        margin: 40px;
        padding: 20px;
        border: 2px dashed #aaa;
        background-color: white;
        overflow: hidden;
      }

      #space {
        margin: 40px;
      }

      .box {
        /* This font has problems with mirage-engine"
        /* font-family: "Times New Roman", Times, serif; */
        width: 100%;
        height: 60px;
        box-sizing: border-box;
        /* transition: all 0.5s ease; */
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      canvas {
        display: block;
        /* border: 2px solid blue; */
        z-index: 999;
        /* transform: scaleY(-1); 
        filter: blur(1px); */
      }

      #test-btn {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        border: 1px solid #333;
      }

      #css-test span {
        background-color: rgba(255, 255, 255, 0);
        border: solid 10px rgba(255, 0, 255, 0.5);
        padding: 10px;
        color: blue;
        border-radius: 0px 5px 10px 20px;
      }
    </style>
  </head>
  <body>
    <div class="showcase">
      <div class="showcase-content">
    <!-- <div id="root" class="exclude"> -->
    <div
      id="loading"
      style="
        position: absolute;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: white;
        z-index: 1000;
        font-size: 24px;
        color: #666;
        display: none;
      "
    >
      loading...
    </div>
    <div id="root" data-mirage-filter="">
      <div id="css-test">
        <span>TEST</span>
      </div>
      <h1 data-mirage-filter="include-self">
        mirage-engine Test Environment
        <span style="color: darkorange">(not-included)</span>
      </h1>
      <button id="test-btn" onclick="alert('test')">Test Button</button>
      <h3 id="box-test" style="color: #1e3a8a;">BOX test</h3>

      <div
        id="box-parent"
        class="native"
        style="
          display: flex;
          gap: 20px;
          color: red;
          background: lightgrey;
          padding: 20px;
          border-radius: 10px;
          position: relative;
        "
        data-mirage-filter="include-tree"
      >
        <div
          id="box-z"
          class="box"
          style="background-color: rgba(255, 255, 255, 0.8); text-align: center; box-shadow: 5px 5px 5px 2px black;"
          data-mirage-select="include-tree"
          data-mirage-travel="traveler 1"
          data-mirage-dom="hide"
        >
          <div data-mirage-sandwich="" data-mirage-filter="">(not-exclude)</div>
        </div>
        <div
          id="box1"
          class="box"
          style="
            /* background-color: black; */
            color: white;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 30px;
            background: linear-gradient(red, blue);
            /* background: linear-gradient(in oklab, red, blue); */
            /* background: linear-gradient(in srgb-linear, red, blue); */
          "
        >
          <span>test, test, test</span>
        </div>

        <div
          id="box2"
          class="box"
          style="
            opacity: 1;
            position: fixed;
            /* position: absolute; */
            right: 50%;
            top: 100px;
            width: 120px;
            border-radius: 200px;
            height: 100px;
            width: 150px;
            z-index: 5;
            /*box-shadow:;
            0 4px 6px -1px rgba(0, 0, 0, 0.4);*/
            background-color: rgba(0, 0, 0, 0.2);
            cursor: pointer;
            /* background: linear-gradient( */
            /* rgba(0, 0, 0, 0.98) 0%, */
            /* rgba(0, 0, 0, 0.93) 40%, */
            /* rgba(0, 0, 0, 0.9) 43%, */
            /* rgba(0, 0, 0, 0.1) 100% */
            /* ); */
          "
          data-mirage-select="include-tree"
          data-mirage-travel="traveler 2"
          data-mirage-dom="hide"
        >
          <div
            id="box2-child"
            data-mirage-sandwich="front"
            data-mirage-filter="end"
            style="
              height: 20px;
              text-align: center;
              color: black;
              position: relative;
              z-index: 1;
              font-weight: bold;
            "
          >
            Hello Sandwich
          </div>
        </div>
      </div>
      <div style="margin-top: 20px; text-align: center">
        <svg
          class="icon-test"
          id="native-svg"
          viewBox="0 0 100 100"
          style="
            width: 150px;
            height: 150px;
            color: #1e3a8a;
            fill: currentColor;
          "
        >
          <circle cx="50" cy="50" r="40" />
          <text
            x="50"
            y="50"
            fill="black"
            font-size="20"
            text-anchor="middle"
            dominant-baseline="middle"
          >
            SVG
          </text>
        </svg>
      </div>
      <div
        id="box-gsap"
        class="box"
        style="
          background-color: rebeccapurple;
          width: 150px;
          margin-left: 0;
          margin-top: 20px;
          color: white;
        "
      >
        GSAP Target
      </div>

      <div
        id="image-test"
        class="box"
        style="
          margin-top: 20px;
          height: 300px;
          background-image: url(&quot;./test.png&quot;);
          background-size: cover;
          background-position: center;
          color: white;
          font-weight: bold;
          text-shadow: 1px 1px 2px black;
        "
      >
        Lazy Loaded Image Test
      </div>

      <img
        src="./test.png"
        style="
          width: 100%;
          max-width: 400px;
          height: auto;
          margin-top: 20px;
          border-radius: 10px;
          display: block;
        "
        alt="Test Image"
      />
    </div>
    <div id="space" style="height: 1500px;"></div>
      </div>
    </div>

    <script type="module" src="./main.ts"></script>

      // Initialize Lenis for Virtual Scroll testing on a specific wrapper
      const lenis = new Lenis({
        wrapper: document.querySelector('.showcase'),
        content: document.querySelector('.showcase-content'),
        autoRaf: true,
        duration: 1.2,
        syncTouch: true,
      });

  </body>
</html>
