name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check READMEs are up to date
        run: |
          pnpm readme
          if ! git diff --exit-code -- README.md '**/README.md'; then
            echo "::error::README.md is out of date. Run 'pnpm readme' and commit the result."
            exit 1
          fi

      - name: Build All Packages
        run: pnpm -r build
