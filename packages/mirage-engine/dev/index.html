<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MirageEngine Test</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: "Ariel", sans-serif;
        background-color: #f0f0f0;
        color: #333;
      }

      #root {
        margin: 40px;
        padding: 20px;
        border: 2px dashed #aaa;
        background-color: white;
        overflow: hidden;
      }

      #space {
        margin: 40px;
      }

      .box {
        color: blue;
        font-family: "Times New Roman", Times, serif;
        width: 100%;
        height: 60px;
        margin-top: 15px;
        box-sizing: border-box;
        transition: all 0.5s ease;
        border-radius: 8px;
      }

      canvas {
        display: block;
        /* border: 2px solid blue; */
        z-index: 999;
        /* transform: scaleY(-1); 
        filter: blur(1px); */
      }

      #test-btn {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        border: 1px solid #333;
      }

      #css-test span {
        background-color: rgba(255, 255, 255, 0);
        border: solid 10px rgba(255, 0, 255, 0.5);
        padding: 10px;
        color: blue;
        border-radius: 0px 5px 10px 20px;
      }
    </style>
  </head>
  <body>
    <!-- <div id="root" class="exclude"> -->
    <div id="root">
      <div id="css-test">
        <span>TEST</span>
      </div>
      <h1>mirage-engine 동기화 테스트 (+GSAP)</h1>
      <button id="test-btn" onclick="alert('test')">테스트 버튼</button>
      <p>
        2초: 파란박스 색 변경 (CSS Transition) <br />
        4초: 노란박스 추가 (DOM 추가) <br />
        <b>6초: 보라색 박스 GSAP 이동 (JS 애니메이션)</b>
      </p>

      <div id="box1" class="box" style="background-color: steelblue">
        Box 1 (2초 뒤 색상 변경 - CSS)
      </div>

      <div
        id="box2"
        class="box exclude"
        style="background-color: seagreen; opacity: 0.8"
        data-mirage-filter="end exclude-tree"
      >
        Box 2 (반투명)
        <div
          id="box2-child"
          style="background-color: white; height: 20px; margin: 5px"
        >
          Child box
        </div>
      </div>

      <div
        id="box-gsap"
        class="box"
        style="background-color: rebeccapurple; width: 150px; margin-left: 0"
      >
        GSAP Target (6초 뒤 이동)
      </div>
    </div>
    <div id="space"></div>

    <script type="module" src="./main.ts"></script>
