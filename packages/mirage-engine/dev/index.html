<!doctype html>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MirageEngine Test</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: "Ariel", sans-serif;
        background-color: #f0f0f0;
        color: #333;
      }

      #root {
        margin: 40px;
        padding: 20px;
        border: 2px dashed #aaa;
        background-color: white;
        overflow: hidden;
      }

      #space {
        margin: 40px;
      }

      .box {
        /* This font has problems with mirage-engine"
        /* font-family: "Times New Roman", Times, serif; */
        width: 100%;
        height: 60px;
        box-sizing: border-box;
        /* transition: all 0.5s ease; */
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      canvas {
        display: block;
        /* border: 2px solid blue; */
        z-index: 999;
        /* transform: scaleY(-1); 
        filter: blur(1px); */
      }

      #test-btn {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        border: 1px solid #333;
      }

      #css-test span {
        background-color: rgba(255, 255, 255, 0);
        border: solid 10px rgba(255, 0, 255, 0.5);
        padding: 10px;
        color: blue;
        border-radius: 0px 5px 10px 20px;
      }
    </style>
  </head>
  <body>
    <!-- <div id="root" class="exclude"> -->
    <div
      id="loading"
      style="
        position: absolute;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: white;
        z-index: 1000;
        font-size: 24px;
        color: #666;
        display: none;
      "
    >
      loading...
    </div>
    <div id="root" data-mirage-filter="">
      <div id="css-test">
        <span>TEST</span>
      </div>
      <h1 data-mirage-filter="include-self">
        mirage-engine Test Environment
        <span style="color: darkorange">(not-included)</span>
      </h1>
      <button id="test-btn" onclick="alert('test')">Test Button</button>
      <h3>BOX test</h3>

      <div
        style="
          display: flex;
          gap: 20px;
          background: lightgrey;
          padding: 20px;
          border-radius: 10px;
          position: relative;
        "
        data-mirage-filter="include-tree"
      >
        <div
          class="box"
          style="background-color: darkorchid; color: white; text-align: center"
        >
          (not-exclude)
        </div>
        <div

            border-radius: 30px;
            background: linear-gradient(red, blue);
            /* background: linear-gradient(in oklab, red, blue); */
            /* background: linear-gradient(in srgb-linear, red, blue); */
          "
        >
          <span>test, test, test</span>
        </div>

        <div
          id="box2"
          class="box"
          style="
            opacity: 1;
            /* position: fixed; */
            position: absolute;
            right: 100px;
            top: 10px;
            width: 120px;
            border-radius: 50px;
            height: 100px;
            width: 150px;
            /*box-shadow:;
            0 4px 6px -1px rgba(0, 0, 0, 0.4);*/
            /* background-color: rgba(0, 0, 0, 1); */
            /* background: linear-gradient(rgba(0, 0, 0, 1), rgba(0, 0, 0, 0.05) 70%); */
          "
          data-mirage-travel="traveler"
        >
          <div id="box2-child" style="height: 20px; text-align: center"></div>
        </div>
      </div>

      <div
        id="box-gsap"
        class="box"
        style="
          background-color: rebeccapurple;
          width: 150px;
          margin-left: 0;
          margin-top: 20px;
          color: white;
        "
      >
        GSAP Target
      </div>
    </div>
    <div id="space"></div>
