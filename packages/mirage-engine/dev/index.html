<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MirageEngine Test</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: "Ariel", sans-serif;
        background-color: #f0f0f0;
        color: #333;
      }

      #root {
        margin: 40px;
        padding: 20px;
        border: 2px dashed #aaa;
        background-color: white;
        overflow: hidden;
      }

      #space {
        margin: 40px;
      }

      .box {
        color: black;
        /* This font has problems with mirage-engine"
        /* font-family: "Times New Roman", Times, serif; */
        width: 100%;
        height: 60px;
        box-sizing: border-box;
        /* transition: all 0.5s ease; */
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      canvas {
        display: block;
        /* border: 2px solid blue; */
        z-index: 999;
        /* transform: scaleY(-1); 
        filter: blur(1px); */
      }

      #test-btn {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        border: 1px solid #333;
      }

      #css-test span {
        background-color: rgba(255, 255, 255, 0);
        border: solid 10px rgba(255, 0, 255, 0.5);
        padding: 10px;
        color: blue;
        border-radius: 0px 5px 10px 20px;
      }
    </style>
  </head>
  <body>
    <!-- <div id="root" class="exclude"> -->
    <div
      id="loading"
      style="
        position: absolute;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: white;
        z-index: 1000;
        font-size: 24px;
        color: #666;
        display: none;
      "
    >
      loading...
    </div>
    <div id="root" data-mirage-filter="">
      <div id="css-test">
        <span>TEST</span>
      </div>
      <h1 data-mirage-filter="include-self">
        mirage-engine Test Environment
        <span style="color: darkorange">(not-included)</span>
      </h1>
      <button id="test-btn" onclick="alert('test')">Test Button</button>
      <h3>BOX test</h3>

      <div
        style="
          display: flex;
          gap: 20px;
          background: lightgrey;
          padding: 20px;
          border-radius: 10px;
          position: relative;
        "
        data-mirage-filter="include-tree"
      >
        <div
          class="box"
          style="background-color: darkorchid; color: white; text-align: center"
        >
          (not-exclude)
        </div>
        <div
          id="box1"
          class="box"
          style="
            background-color: black;
            color: white;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 30px;
          "
        >
          <span>test, test, test</span>
        </div>

        <div
          id="box2"
          class="box"
          style="
            opacity: 1;
            position: absolute;
            right: 100px;
            bottom: 10px;
            width: 200px;
            border-radius: 30px;
            height: 80px;
            width: 150px;
            /* background-color: lightcoral; */
          "
          data-mirage-travel="traveler"
        >
          <div id="box2-child" style="height: 20px; text-align: center"></div>
        </div>
      </div>

      <div
        id="box-gsap"
        class="box"
        style="
          background-color: rebeccapurple;
          width: 150px;
          margin-left: 0;
          margin-top: 20px;
          color: white;
        "
      >
        GSAP Target
      </div>
    </div>
    <div id="space"></div>

    <script type="module" src="./main.ts"></script>

    <script id="dom-manipulator-script">
      console.log("DOM 조작기: 테스트 시나리오 시작...");

      //setTimeout(() => {
      //console.log("TEST 1: #box1 색상 변경 (CSS Transition)");
      //const box1 = document.getElementById("box1");
      //  if (box1) box1.style.backgroundColor = "crimson";
      //}, 2000);
      gsap.to("#box1", {
        backgroundColor: "crimson",
        duration: 5,
        delay: 1,
        ease: "power2.inOut",
      });

      setTimeout(() => {
        console.log("TEST 2: #root에 새 박스 추가");
        const root = document.getElementById("root");
        const newBox = document.createElement("div");
        newBox.className = "box";
        newBox.style.backgroundColor = "goldenrod";
        newBox.style.height = "50px";
        newBox.textContent = "New Box (DOM Added)";
        if (root) root.appendChild(newBox);
      }, 4000);

      setTimeout(() => {
        console.log("TEST 3: GSAP 애니메이션 시작! (2초간 지속)");
        console.log(
          "-> 캔버스는 움직이지 않다가, 2초 뒤 끝난 위치로 순간이동 해야 성공!",
        );

        gsap.to("#box-gsap", {
          x: 400,
          // backgroundColor: "#FF5733",
          // rotation: 360,
          duration: 2,
          ease: "power2.inOut",
        });

        gsap.to("#box2", {
          x: -200,
          width: 200,
          duration: 2,
          ease: "power2.inOut",
        });
      }, 6000);
    </script>
  </body>
</html>
